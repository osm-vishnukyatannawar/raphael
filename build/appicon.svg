<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Raphael app icon: geometric R monogram on a rounded tile.

    The R is drawn as paths, not text, so rendering does not depend on a font
    being installed on whatever machine runs `make icon`. Flat fill and heavy
    strokes are deliberate: the mark has to stay legible at 16px in a taskbar.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="55%" stop-color="#1E4E8C"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#tile)"/>

  <!--
    The glyph's own bounds are x 336..738, so its centre sits at 537 — 25px
    right of the canvas centre. This transform recentres it on 512 and scales it
    up 5% so the mark fills the tile properly.
  -->
  <g transform="translate(512 512) scale(1.05) translate(-537 -512)">
  <path fill="#FFFFFF" fill-rule="evenodd" d="
    M 336 256
    H 576
    C 672 256 726 316 726 402
    C 726 470 688 520 628 540
    L 738 768
    H 596
    L 502 560
    H 452
    V 768
    H 336
    Z
    M 452 360
    V 456
    H 570
    C 614 456 638 436 638 408
    C 638 380 614 360 570 360
    Z
  "/>
  </g>
</svg>
